<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modbus Device Studio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap');
    :root {
      --ink: #18201d;
      --muted: #65706b;
      --paper: #f3f3ef;
      --panel: #ffffff;
      --line: #d9ddd8;
      --accent: #e64b35;
      --accent-dark: #be3523;
      --green: #167a5a;
      --green-soft: #dff3e9;
      --warning: #a85b13;
      --shadow: 0 14px 34px rgba(20, 31, 26, .09);
    }
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: Manrope, sans-serif; font-size: 14px; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { min-height: 100vh; display: grid; grid-template-rows: 64px 1fr; }
    header { background: var(--ink); color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 17px; }
    .brand-mark { width: 28px; height: 28px; display: grid; place-items: center; color: var(--ink); background: #f0c94d; border-radius: 5px; font: 700 13px 'IBM Plex Mono'; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .status { display: flex; gap: 7px; align-items: center; margin-right: 10px; color: #cbd2ce; font-size: 12px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #42d197; box-shadow: 0 0 0 4px rgba(66,209,151,.13); }
    .layout { min-height: 0; display: grid; grid-template-columns: 290px 1fr; }
    aside { background: #e9ebe7; border-right: 1px solid var(--line); padding: 20px 14px; overflow: auto; }
    .aside-title { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 12px; }
    .aside-title span { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .device-list { display: grid; gap: 6px; }
    .device-item { width: 100%; border: 1px solid transparent; background: transparent; text-align: left; border-radius: 6px; padding: 11px 12px; display: grid; grid-template-columns: 36px 1fr; gap: 10px; color: var(--ink); }
    .device-item:hover { background: rgba(255,255,255,.6); }
    .device-item.active { background: white; border-color: #cfd4cf; box-shadow: 0 4px 14px rgba(20,31,26,.06); }
    .unit { font: 500 12px 'IBM Plex Mono'; color: var(--green); padding-top: 2px; }
    .device-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .device-meta { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
    main { min-width: 0; overflow: auto; padding: 28px clamp(18px, 4vw, 54px) 70px; }
    .empty { min-height: 60vh; display: grid; place-items: center; color: var(--muted); }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    h1 { font-size: 34px; line-height: 1.2; letter-spacing: 0; margin: 0 0 6px; }
    .subtitle { color: var(--muted); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { min-height: 36px; border: 1px solid #cfd4cf; border-radius: 5px; background: white; color: var(--ink); padding: 7px 12px; font-weight: 600; display: inline-flex; gap: 7px; align-items: center; justify-content: center; }
    .btn:hover { border-color: #aeb6b0; }
    .btn.primary { color: white; background: var(--accent); border-color: var(--accent); }
    .btn.primary:hover { background: var(--accent-dark); }
    .btn.danger { color: #b42f20; }
    .btn.icon { width: 34px; padding: 0; font-size: 19px; }
    .btn:disabled { opacity: .5; cursor: default; }
    .section { border-top: 1px solid var(--line); padding: 22px 0 26px; }
    .section h2 { font-size: 15px; margin: 0 0 16px; }
    .form-grid { display: grid; grid-template-columns: minmax(220px, 2fr) minmax(130px, 1fr) minmax(180px, 1fr); gap: 16px; }
    label { display: grid; gap: 7px; font-size: 12px; font-weight: 600; color: #4f5954; }
    input, select, textarea { width: 100%; border: 1px solid #cbd1cc; border-radius: 5px; background: white; color: var(--ink); padding: 9px 10px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(22,122,90,.1); }
    .toggle-row { display: flex; gap: 24px; margin-top: 18px; flex-wrap: wrap; }
    .toggle { display: flex; align-items: center; gap: 8px; color: var(--ink); }
    .toggle input { width: 17px; height: 17px; accent-color: var(--green); }
    .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
    .tab { border: 0; background: transparent; color: var(--muted); padding: 10px 12px; white-space: nowrap; font-weight: 600; border-bottom: 2px solid transparent; }
    .tab.active { color: var(--ink); border-color: var(--accent); }
    .table-head { display: flex; justify-content: space-between; align-items: center; margin: 15px 0 10px; }
    .count { font: 12px 'IBM Plex Mono'; color: var(--muted); }
    .table-wrap { overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    th { text-align: left; color: var(--muted); background: #f8f9f7; font-size: 11px; text-transform: uppercase; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    td { padding: 12px 14px; border-bottom: 1px solid #e8ebe7; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fbfcfa; }
    .mono { font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
    .pill { display: inline-block; background: var(--green-soft); color: #116046; border-radius: 4px; padding: 3px 7px; font: 500 11px 'IBM Plex Mono'; }
    .row-actions { text-align: right; white-space: nowrap; }
    .link-btn { border: 0; background: transparent; color: var(--green); padding: 4px 6px; font-weight: 600; }
    dialog { border: 0; border-radius: 8px; box-shadow: var(--shadow); padding: 0; width: min(560px, calc(100vw - 28px)); }
    dialog::backdrop { background: rgba(14, 22, 18, .48); }
    .modal-head { padding: 20px 22px 13px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-size: 19px; }
    .modal-body { padding: 20px 22px; display: grid; gap: 15px; }
    .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    textarea { min-height: 125px; resize: vertical; font: 12px/1.5 'IBM Plex Mono'; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px; background: #f6f7f5; border-top: 1px solid var(--line); }
    .toast { position: fixed; right: 22px; bottom: 22px; max-width: min(400px, calc(100vw - 44px)); padding: 12px 16px; background: var(--ink); color: white; border-radius: 6px; box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); pointer-events: none; transition: .2s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: #a72e20; }
    .dirty { color: #ffd56a; display: none; }
    .dirty.show { display: inline; }
    @media (max-width: 760px) {
      .shell { grid-template-rows: auto 1fr; }
      header { min-height: 64px; padding: 10px 14px; gap: 8px; }
      .status { display: none; }
      .layout { grid-template-columns: 1fr; }
      .layout > * { min-width: 0; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); padding: 12px; }
      .aside-title { padding-bottom: 8px; }
      .device-list { display: flex; overflow-x: auto; }
      .device-item { min-width: min(210px, calc(100vw - 40px)); }
      main { width: 100%; max-width: 100vw; padding: 22px 16px 60px; }
      .page-head { display: block; }
      .page-head .actions { display: grid; grid-template-columns: 1fr 1fr; margin-top: 14px; }
      .page-head .actions .btn { min-width: 0; }
      .form-grid, .modal-grid { grid-template-columns: 1fr; }
      .header-actions .btn { padding: 7px 9px; }
      h1 { font-size: 28px; }
    }
    @media (max-width: 500px) {
      header { align-items: stretch; flex-direction: column; }
      .brand { font-size: 15px; }
      .header-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .header-actions .btn { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><span class="brand-mark">MB</span> Device Studio</div>
      <div class="header-actions">
        <div class="status"><span class="status-dot"></span><span>Simulator online</span><span class="dirty" id="dirtyState">Unsaved changes</span></div>
        <button class="btn" id="importButton" type="button" title="Import JSON or CSV configuration">Import</button>
        <button class="btn" id="exportButton" type="button" title="Export JSON configuration">JSON</button>
        <button class="btn" id="exportCsvButton" type="button" title="Export CSV configuration">CSV</button>
        <input id="fileInput" type="file" accept="application/json,text/csv,.json,.csv" hidden>
      </div>
    </header>
    <div class="layout">
      <aside>
        <div class="aside-title"><span>Modbus devices</span><button class="btn icon" id="addDevice" title="Add device">+</button></div>
        <div class="device-list" id="deviceList"></div>
      </aside>
      <main id="main"><div class="empty">Loading configuration...</div></main>
    </div>
  </div>

  <dialog id="pointDialog">
    <form id="pointForm" method="dialog">
      <div class="modal-head"><h2 id="pointTitle">Add point</h2></div>
      <div class="modal-body">
        <div class="modal-grid">
          <label>Point name<input id="pointName" required></label>
          <label>Address<input id="pointAddress" type="number" min="0" required></label>
        </div>
        <div id="initialFields"><label id="initialLabel">Initial value<input id="initialValue"></label></div>
        <div id="automationFields">
          <div class="modal-grid">
            <label>Automation type<select id="automationType"><option value="sine">Sine wave</option><option value="linear">Linear ramp</option><option value="dew_point_fahrenheit">Dew point (°F)</option></select></label>
          </div>
          <label>Automation settings (JSON)<textarea id="automationSettings" spellcheck="false"></textarea></label>
        </div>
      </div>
      <div class="modal-actions"><button class="btn" value="cancel" type="button" id="cancelPoint">Cancel</button><button class="btn primary" value="default" type="submit">Save point</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast"></div>

  <script>
    const groups = {
      coils: { label: 'Coils', short: 'Coil', automation: false, boolean: true },
      writable_holding_registers: { label: 'Writable holding', short: 'Writable register', automation: false },
      holding_registers: { label: 'Holding registers', short: 'Holding register', automation: true },
      input_registers: { label: 'Input registers', short: 'Input register', automation: true }
    };
    let config = null;
    let selectedIndex = 0;
    let activeGroup = 'coils';
    let editingPoint = null;
    let dirty = false;

    const main = document.getElementById('main');
    const deviceList = document.getElementById('deviceList');
    const dialog = document.getElementById('pointDialog');
    const toast = document.getElementById('toast');

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }

    function notify(message, error = false) {
      toast.textContent = message;
      toast.className = `toast show${error ? ' error' : ''}`;
      clearTimeout(notify.timer);
      notify.timer = setTimeout(() => toast.className = 'toast', 3200);
    }

    function setDirty(value = true) {
      dirty = value;
      document.getElementById('dirtyState').classList.toggle('show', value);
      const save = document.getElementById('saveConfig');
      if (save) save.disabled = !value;
    }

    async function api(url, options) {
      const response = await fetch(url, options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    async function load() {
      try {
        config = await api('/api/config');
        render();
      } catch (error) {
        main.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }

    function render() {
      renderDevices();
      renderEditor();
    }

    function renderDevices() {
      deviceList.innerHTML = config.devices.map((device, index) => `
        <button class="device-item ${index === selectedIndex ? 'active' : ''}" data-device="${index}">
          <span class="unit">#${device.unit_id}</span>
          <span><span class="device-name">${escapeHtml(device.name)}</span><span class="device-meta">${pointCount(device)} points</span></span>
        </button>`).join('');
      deviceList.querySelectorAll('[data-device]').forEach(button => button.onclick = () => {
        selectedIndex = Number(button.dataset.device);
        render();
      });
    }

    function pointCount(device) {
      return Object.keys(groups).reduce((sum, key) => sum + device[key].length, 0);
    }

    function renderEditor() {
      const device = config.devices[selectedIndex];
      if (!device) {
        main.innerHTML = '<div class="empty">Add a device to begin.</div>';
        return;
      }
      const points = device[activeGroup];
      main.innerHTML = `
        <div class="page-head">
          <div><h1>${escapeHtml(device.name)}</h1><div class="subtitle">Unit ${device.unit_id} · ${pointCount(device)} configured points</div></div>
          <div class="actions"><button class="btn danger" id="deleteDevice">Delete device</button><button class="btn primary" id="saveConfig" ${dirty ? '' : 'disabled'}>Apply changes</button></div>
        </div>
        <section class="section">
          <h2>Device settings</h2>
          <div class="form-grid">
            <label>Device name<input data-field="name" value="${escapeHtml(device.name)}"></label>
            <label>Unit ID<input data-field="unit_id" type="number" min="1" max="247" value="${device.unit_id}"></label>
            <label>Address base<select data-field="zero_based"><option value="false" ${!device.zero_based ? 'selected' : ''}>One-based</option><option value="true" ${device.zero_based ? 'selected' : ''}>Zero-based</option></select></label>
          </div>
          <div class="toggle-row"><label class="toggle"><input data-field="reverse_word_order" type="checkbox" ${device.reverse_word_order ? 'checked' : ''}> Reverse 32-bit word order</label></div>
        </section>
        <section class="section">
          <h2>Point map</h2>
          <div class="tabs">${Object.entries(groups).map(([key, group]) => `<button class="tab ${key === activeGroup ? 'active' : ''}" data-group="${key}">${group.label} <span class="mono">${device[key].length}</span></button>`).join('')}</div>
          <div class="table-head"><span class="count">${points.length} ${points.length === 1 ? 'POINT' : 'POINTS'}</span><button class="btn" id="addPoint">+ Add point</button></div>
          <div class="table-wrap"><table><thead><tr><th>Address</th><th>Name</th><th>Behavior</th><th></th></tr></thead><tbody>
            ${points.length ? points.map((point, index) => pointRow(point, index)).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:28px">No points in this table</td></tr>'}
          </tbody></table></div>
        </section>`;
      bindEditor(device);
    }

    function pointRow(point, index) {
      let behavior = point.automation ? point.automation.type : (groups[activeGroup].boolean ? (point.initial_value ? 'On' : 'Off') : point.initial_value);
      return `<tr><td class="mono">${point.address}</td><td>${escapeHtml(point.name)}</td><td><span class="pill">${escapeHtml(behavior)}</span></td><td class="row-actions"><button class="link-btn" data-edit="${index}">Edit</button><button class="link-btn" data-remove="${index}">Remove</button></td></tr>`;
    }

    function bindEditor(device) {
      main.querySelectorAll('[data-field]').forEach(input => input.onchange = () => {
        const field = input.dataset.field;
        device[field] = input.type === 'checkbox' ? input.checked : field === 'unit_id' ? Number(input.value) : field === 'zero_based' ? input.value === 'true' : input.value;
        setDirty();
        renderDevices();
      });
      main.querySelectorAll('[data-group]').forEach(button => button.onclick = () => { activeGroup = button.dataset.group; renderEditor(); });
      main.querySelectorAll('[data-edit]').forEach(button => button.onclick = () => openPoint(Number(button.dataset.edit)));
      main.querySelectorAll('[data-remove]').forEach(button => button.onclick = () => {
        device[activeGroup].splice(Number(button.dataset.remove), 1);
        setDirty(); render();
      });
      document.getElementById('addPoint').onclick = () => openPoint(null);
      document.getElementById('deleteDevice').onclick = () => {
        if (!confirm(`Delete ${device.name}?`)) return;
        config.devices.splice(selectedIndex, 1);
        selectedIndex = Math.max(0, selectedIndex - 1);
        setDirty(); render();
      };
      document.getElementById('saveConfig').onclick = save;
    }

    function openPoint(index) {
      editingPoint = index;
      const group = groups[activeGroup];
      const existing = index === null ? null : config.devices[selectedIndex][activeGroup][index];
      document.getElementById('pointTitle').textContent = `${existing ? 'Edit' : 'Add'} ${group.short.toLowerCase()}`;
      document.getElementById('pointName').value = existing?.name || '';
      document.getElementById('pointAddress').value = existing?.address ?? (config.devices[selectedIndex].zero_based ? 0 : 1);
      document.getElementById('initialFields').hidden = group.automation;
      document.getElementById('automationFields').hidden = !group.automation;
      document.getElementById('initialLabel').firstChild.textContent = group.boolean ? 'Initial state' : 'Initial value';
      const initial = document.getElementById('initialValue');
      initial.type = group.boolean ? 'checkbox' : 'number';
      initial.step = 'any';
      initial.checked = Boolean(existing?.initial_value);
      initial.value = existing?.initial_value ?? 0;
      const type = existing?.automation?.type || 'sine';
      document.getElementById('automationType').value = type;
      document.getElementById('automationSettings').value = JSON.stringify(automationSettings(existing?.automation || defaultAutomation(type)), null, 2);
      dialog.showModal();
    }

    function defaultAutomation(type) {
      if (type === 'linear') return { type, duration: 60, start: 0, end: 100, loop: true };
      if (type === 'dew_point_fahrenheit') return { type, temperature: { type: 'sine', amplitude: 5, period: 120, offset: 70 }, humidity: { type: 'sine', amplitude: 10, period: 120, offset: 50 } };
      return { type, amplitude: 1, period: 60, offset: 0 };
    }

    function automationSettings(automation) {
      const copy = structuredClone(automation);
      delete copy.type;
      return copy;
    }

    document.getElementById('automationType').onchange = event => {
      document.getElementById('automationSettings').value = JSON.stringify(automationSettings(defaultAutomation(event.target.value)), null, 2);
    };
    document.getElementById('cancelPoint').onclick = () => dialog.close();
    document.getElementById('pointForm').onsubmit = event => {
      event.preventDefault();
      try {
        const group = groups[activeGroup];
        const point = { address: Number(document.getElementById('pointAddress').value), name: document.getElementById('pointName').value.trim() };
        if (!point.name) throw new Error('Point name is required');
        if (group.automation) point.automation = { type: document.getElementById('automationType').value, ...JSON.parse(document.getElementById('automationSettings').value) };
        else point.initial_value = group.boolean ? document.getElementById('initialValue').checked : Number(document.getElementById('initialValue').value);
        const points = config.devices[selectedIndex][activeGroup];
        if (editingPoint === null) points.push(point); else points[editingPoint] = point;
        setDirty(); dialog.close(); render();
      } catch (error) { notify(error.message, true); }
    };

    async function save() {
      try {
        config = await api('/api/config', { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(config) });
        setDirty(false); render(); notify('Configuration applied to the running simulator');
      } catch (error) { notify(error.message, true); }
    }

    document.getElementById('addDevice').onclick = () => {
      const used = new Set(config.devices.map(device => device.unit_id));
      let unitId = 1; while (used.has(unitId)) unitId++;
      config.devices.push({ name: 'New device', unit_id: unitId, zero_based: false, reverse_word_order: false, coils: [], writable_holding_registers: [], holding_registers: [], input_registers: [] });
      selectedIndex = config.devices.length - 1; setDirty(); render();
    };
    document.getElementById('exportButton').onclick = () => location.href = '/api/export/json';
    document.getElementById('exportCsvButton').onclick = () => location.href = '/api/export/csv';
    document.getElementById('importButton').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('fileInput').onchange = async event => {
      if (!event.target.files[0]) return;
      const file = event.target.files[0];
      const body = new FormData(); body.append('file', file);
      try {
        const format = file.name.toLowerCase().endsWith('.csv') ? 'csv' : 'json';
        config = await api(`/api/import/${format}`, { method: 'POST', body });
        selectedIndex = 0; setDirty(false); render(); notify('Configuration imported and applied');
      } catch (error) { notify(error.message, true); }
      event.target.value = '';
    };
    window.onbeforeunload = event => { if (dirty) event.preventDefault(); };
    load();
  </script>
</body>
</html>
